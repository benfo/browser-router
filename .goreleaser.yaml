version: 2

builds:
  # CLI - console app, all interactive commands
  - id: cli
    binary: browser-router
    env: [CGO_ENABLED=0]
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    ldflags: [-s -w]

  # windowsgui handler - registered as the OS default browser, no console flash
  - id: handler
    binary: browser-router-open
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-tags=handler]
    ldflags: [-s -w -H windowsgui]

archives:
  - ids: [cli, handler]
    allow_different_binary_count: true # handler is windows-only
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github
